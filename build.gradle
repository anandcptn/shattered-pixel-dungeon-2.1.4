buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.0.2'
    }
}

allprojects {

    ext {
        appName = 'Shattered Pixel Dungeon'
        appPackageName = 'com.shatteredpixel.shatteredpixeldungeon'

        appVersionCode = 736
        appVersionName = '2.1.4'

        appJavaCompatibility = JavaVersion.VERSION_1_8

        appAndroidCompileSDK = 33
        appAndroidMinSDK = 14
        appAndroidTargetSDK = 33

        gdxVersion = '1.11.0'
        // Was '2.2.4-SNAPSHOT' — the Sonatype OSSRH snapshot host that version depended on
        // was permanently shut down June 30, 2025. 2.2.4 is available as a normal release
        // on mavenCentral(), so switching off the SNAPSHOT suffix fixes resolution.
        gdxControllersVersion = '2.2.4'
        robovmVersion = '2.3.19'
    }
    version = appVersionName

    repositories {
        google()
        mavenCentral()
        maven { url 'https://oss.sonatype.org/content/repositories/snapshots' }
    }

}
