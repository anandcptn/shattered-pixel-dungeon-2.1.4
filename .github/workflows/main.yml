name: Build Debug APK

# Trigger manually, or automatically on pushes/PRs to your working branch.
# Adjust the branch name below to whatever branch you're committing your edits to.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:   # lets you trigger it manually from the Actions tab

jobs:
  build-debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew :android:assembleDebug --stacktrace

      - name: Locate APK
        id: find_apk
        run: |
          APK_PATH=$(find . -type f -name "*debug*.apk" | head -n 1)
          echo "APK found at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: shattered-pixel-dungeon-debug-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
          if-no-files-found: error
          
