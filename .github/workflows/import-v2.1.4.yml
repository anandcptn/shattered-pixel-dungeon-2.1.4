name: Import Shattered Pixel Dungeon v2.1.4

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout my repository
        uses: actions/checkout@v4

      - name: Download v2.1.4 source
        run: |
          git clone --depth 1 --branch v2.1.4 \
            https://github.com/00-Evan/shattered-pixel-dungeon.git \
            /tmp/spd

      - name: Copy source into repository
        run: |
          rm -rf /tmp/spd/.git
          cp -a /tmp/spd/. .

      - name: Commit source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .
          git commit -m "Import Shattered Pixel Dungeon v2.1.4" || echo "Nothing to commit"
          git push
